name: Coding Style

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nette_cc:
    name: Nette Code Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - run: composer create-project nette/code-checker temp/code-checker ^3 --no-progress
      - run: php temp/code-checker/code-checker --strict-types --no-progress

  dresscode:
    name: DressCode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - run: composer install --no-progress --prefer-dist
      - run: composer create-project dresscode/dresscode temp/dresscode ^1.1 --no-progress
      - run: composer require --working-dir=temp/dresscode phpstan/phpstan-nette:^2.0 --no-progress
      - run: php temp/dresscode/bin/dresscode check --no-cache
